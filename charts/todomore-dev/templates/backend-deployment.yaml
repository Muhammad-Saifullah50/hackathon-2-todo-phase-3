apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todomore-dev.fullname" . }}-backend
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "todomore-dev.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "todomore-dev.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      serviceAccountName: {{ include "todomore-dev.serviceAccountName" . }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["src.main:app", "--host", "0.0.0.0", "--port", "9000", "--workers", "2"]
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: DATABASE_URL
              value: {{ .Values.postgres.url | quote }}
            - name: OPENROUTER_API_KEY
              value: dev-openrouter
            - name: GEMINI_API_KEY
              value: dev-gemini
            - name: BETTER_AUTH_SECRET
              value: dev-secret
            - name: JWT_SECRET
              value: dev-jwt
            - name: FRONTEND_URL
              value: {{ .Values.backend.env.FRONTEND_URL | quote }}
            - name: MCP_SERVER_URL
              value: {{ .Values.backend.env.MCP_SERVER_URL | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "todomore-dev.fullname" . }}-config
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todomore-dev.fullname" . }}-backend
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
    component: backend
spec:
  selector:
    {{- include "todomore-dev.selectorLabels" . | nindent 4 }}
    component: backend
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: 9000
      name: http
