apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todomore-dev.fullname" . }}-mcp
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
    component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "todomore-dev.selectorLabels" . | nindent 6 }}
      component: mcp
  template:
    metadata:
      labels:
        {{- include "todomore-dev.selectorLabels" . | nindent 8 }}
        component: mcp
    spec:
      serviceAccountName: {{ include "todomore-dev.serviceAccountName" . }}
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: {{ .Values.postgres.url | quote }}
            - name: FRONTEND_URL
              value: http://todomore-frontend:3000
            - name: MCP_HOST
              value: todomore-mcp
            - name: MCP_PORT
              value: {{ .Values.mcp.env.MCP_PORT | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "todomore-dev.fullname" . }}-config
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todomore-dev.fullname" . }}-mcp
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
    component: mcp
spec:
  selector:
    {{- include "todomore-dev.selectorLabels" . | nindent 4 }}
    component: mcp
  ports:
    - port: {{ .Values.service.mcpPort }}
      targetPort: 8000
      name: http
