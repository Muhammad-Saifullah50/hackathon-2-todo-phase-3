{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "todomore-dev.fullname" . }}
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "todomore-dev.fullname" $ }}-{{ .service.name }}
                port:
                  number: {{ .service.port }}
          {{- end }}
    {{- end }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
{{- end }}
