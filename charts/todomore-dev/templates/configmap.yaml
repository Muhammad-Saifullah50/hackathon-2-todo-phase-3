apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todomore-dev.fullname" . }}-config
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
data:
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  NEXT_PUBLIC_BETTER_AUTH_URL: {{ .Values.config.nextPublicBetterAuthUrl | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  MCP_HOST: {{ .Values.config.mcpHost | quote }}
