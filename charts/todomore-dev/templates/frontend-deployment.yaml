apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todomore-dev.fullname" . }}-frontend
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
    component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "todomore-dev.selectorLabels" . | nindent 6 }}
      component: frontend
  template:
    metadata:
      labels:
        {{- include "todomore-dev.selectorLabels" . | nindent 8 }}
        component: frontend
    spec:
      serviceAccountName: {{ include "todomore-dev.serviceAccountName" . }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.env.NEXT_PUBLIC_API_URL | quote }}
            - name: BETTER_AUTH_URL
              value: {{ .Values.frontend.env.BETTER_AUTH_URL | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "todomore-dev.fullname" . }}-config
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todomore-dev.fullname" . }}-frontend
  labels:
    {{- include "todomore-dev.labels" . | nindent 4 }}
    component: frontend
spec:
  selector:
    {{- include "todomore-dev.selectorLabels" . | nindent 4 }}
    component: frontend
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: 3000
      name: http
